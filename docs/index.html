<style>
@import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,100&family=Instrument+Sans:wght@400;500;600&display=swap");

body { margin: 0; font-family: var(--font-sans); font-size: 16px; line-height: 24px; background: var(--surface); color: var(--ink); -webkit-font-smoothing: antialiased; }
.ce-display { font-family: var(--font-display); font-variation-settings: "SOFT" 100; }
.ce-num { font-variant-numeric: tabular-nums; }
.ce-pad { padding: var(--space-4); }
.ce-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; padding: var(--space-4); }
.ce-col { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); max-width: 420px; }
.ce-focus:focus-visible, .ce-btn:focus-visible, .ce-chip:focus-visible, .ce-iconbtn:focus-visible, .ce-tab:focus-visible, .ce-day:focus-visible, .ce-check:focus-visible, .ce-toggle:focus-visible, .ce-bar:focus-visible {
  outline: 2px solid var(--focus); outline-offset: 2px;
}

/* Button */
.ce-btn { font: inherit; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); border: 0; border-radius: var(--radius-pill); cursor: pointer; white-space: nowrap; transition: transform .12s ease, background-color .12s ease; }
.ce-btn:active { transform: scale(.97); }
.ce-btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.ce-btn-sm { height: 36px; padding: 0 var(--space-4); font-size: 14px; }
.ce-btn-md { height: 48px; padding: 0 var(--space-5); font-size: 16px; }
.ce-btn-lg { height: 60px; padding: 0 var(--space-5); font-size: 17px; }
.ce-btn-block { display: flex; width: 100%; }
.ce-btn-primary { background: var(--forest); color: var(--on-forest); }
.ce-btn-grass { background: var(--grass); color: var(--on-grass); }
.ce-btn-secondary { background: var(--surface-sunken); color: var(--ink); }

.ce-btn-trail { justify-content: space-between; padding-right: 6px; }

.ce-btn-lg.ce-btn-trail .ce-btn-orb { width: 48px; height: 48px; }
.ce-btn-spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: ce-spin .7s linear infinite; }

.ce-iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; display: inline-grid; place-items: center; cursor: pointer; background: var(--surface-raised); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.ce-iconbtn-filled { background: var(--forest); color: var(--on-forest); box-shadow: none; }
.ce-iconbtn-grass { background: var(--grass); color: var(--on-grass); box-shadow: none; }
.ce-iconbtn-tomato { background: var(--surface-raised); color: var(--tomato); }
.ce-iconbtn-lg { width: 64px; height: 64px; }

/* Chip */
.ce-chip { font: inherit; font-size: 15px; font-weight: 500; height: 40px; padding: 0 var(--space-4); border-radius: var(--radius-pill); border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: var(--space-2); background: var(--surface-sunken); color: var(--ink); }
.ce-chip[aria-pressed="true"] { background: var(--forest); color: var(--on-forest); }

/* Badge */

.ce-badge-bio { background: var(--oker-soft); color: var(--oker); }

.ce-badge-nieuw { background: var(--tomato-soft); color: var(--tomato); }
.ce-badge-save { background: var(--surface-raised); color: var(--save); box-shadow: inset 0 0 0 1.5px var(--line); }

/* Stepper */

.ce-stepper-val { min-width: 64px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Toggle */
.ce-toggle { width: 52px; height: 32px; border-radius: var(--radius-pill); border: 0; padding: 3px; cursor: pointer; background: var(--surface-sunken); box-shadow: inset 0 0 0 1.5px var(--line); display: inline-flex; transition: background-color .15s; }
.ce-toggle::after { content: ""; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-raised); box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .15s; }
.ce-toggle[aria-checked="true"] { background: var(--grass); box-shadow: none; }
.ce-toggle[aria-checked="true"]::after { transform: translateX(20px); }
.ce-setting { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); background: var(--surface-raised); border-radius: var(--radius-md); }

/* Search */

/* WeekStrip */
.ce-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: var(--space-3); background: var(--surface-raised); border-radius: var(--radius-lg); }
.ce-day { font: inherit; border: 0; background: transparent; color: var(--ink); border-radius: var(--radius-pill); padding: 10px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
.ce-day small { font-size: 12px; line-height: 16px; color: var(--ink-muted); text-transform: lowercase; }

.ce-day i { width: 6px; height: 6px; border-radius: 50%; background: transparent; }

.ce-day[aria-pressed="true"] { background: var(--grass); color: var(--on-grass); }
.ce-day[aria-pressed="true"] small { color: var(--on-grass); }

/* Dish illustration */
.ce-dish { display: block; width: 100%; height: auto; }

/* RecipeCard */
.ce-rcard { display: flex; gap: var(--space-3); align-items: center; padding: var(--space-3); background: var(--surface-raised); border-radius: var(--radius-lg); color: inherit; text-decoration: none; }
.ce-rcard-art { width: 84px; height: 84px; flex: none; border-radius: var(--radius-md); background: var(--lime); overflow: hidden; }
.ce-rcard-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.ce-rcard-title { font-family: var(--font-display); font-variation-settings: "SOFT" 100; font-size: 19px; line-height: 23px; font-weight: 600; }
.ce-rcard-meta { font-size: 14px; line-height: 20px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.ce-rcard-badges { display: flex; flex-wrap: wrap; gap: 6px; }
.ce-rcard-tall { flex-direction: column; align-items: stretch; width: 200px; }

/* SwipeCard */
.ce-swipe { position: relative; background: var(--surface-raised); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-card); user-select: none; touch-action: none; }
.ce-swipe-art { aspect-ratio: 1 / 0.7; overflow: hidden; background: var(--grass); position: relative; }
.ce-swipe-body { padding: var(--space-4) var(--space-5) var(--space-5); display: flex; flex-direction: column; gap: var(--space-2); }
.ce-swipe-title { font-family: var(--font-display); font-variation-settings: "SOFT" 100; font-size: 26px; line-height: 30px; font-weight: 600; letter-spacing: -0.01em; }
.ce-swipe-meta { display: flex; gap: var(--space-4); color: var(--ink-muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.ce-swipe-stamp { position: absolute; top: var(--space-4); padding: 6px 14px; border-radius: var(--radius-pill); font-weight: 600; font-size: 15px; opacity: 0; transition: opacity .1s; }
.ce-swipe-stamp-like { left: var(--space-4); background: var(--forest); color: var(--on-forest); }

.ce-swipe-actions { display: flex; justify-content: center; gap: var(--space-5); padding: var(--space-4); }

/* TipCard (bespaarcoach) */
.ce-tip { border-radius: var(--radius-md); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); background: var(--lime); color: var(--on-lime); }
.ce-tip-warn { background: var(--tomato-soft); color: var(--ink); }
.ce-tip-head { display: flex; gap: var(--space-2); align-items: flex-start; }
.ce-tip-head p { margin: 0; }

.ce-tip .ce-btn-secondary { background: rgba(255,255,255,.55); color: var(--on-lime); }
.ce-tip-warn .ce-btn-secondary { background: var(--surface-raised); color: var(--ink); }

/* CheapestBar */
.ce-bar { font: inherit; width: 100%; border: 0; cursor: pointer; text-align: left; display: flex; align-items: center; gap: var(--space-3); padding: 8px 8px 8px var(--space-5); min-height: 64px; border-radius: var(--radius-pill); background: var(--grass); color: var(--on-grass); box-shadow: var(--shadow-card); }
.ce-bar-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.ce-bar-text b { font-size: 17px; line-height: 22px; font-weight: 600; }
.ce-bar-price { font-family: var(--font-display); font-variation-settings: "SOFT" 100; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ce-bar-orb { width: 48px; height: 48px; border-radius: 50%; background: var(--forest); color: var(--on-forest); display: grid; place-items: center; flex: none; }

/* StoreRow */
.ce-store { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); background: var(--surface-raised); border-radius: var(--radius-md); }

.ce-store-total { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.ce-store-total small { display: block; font-weight: 500; font-size: 13px; line-height: 18px; color: var(--tomato); }
.ce-store[data-best="true"] .ce-store-total small { color: var(--save); }

/* ListItem */
.ce-item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); background: var(--surface-raised); }
.ce-item + .ce-item { border-top: 1px solid var(--line); }
.ce-check { width: 26px; height: 26px; border-radius: var(--radius-sm); border: 0; box-shadow: inset 0 0 0 2px var(--line); background: transparent; display: grid; place-items: center; color: var(--on-grass); cursor: pointer; flex: none; padding: 0; }
.ce-check[aria-checked="true"] { background: var(--grass); box-shadow: none; }
.ce-item-body { flex: 1; min-width: 0; }
.ce-item-body small { display: block; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
.ce-item[data-done="true"] .ce-item-name { text-decoration: line-through; color: var(--ink-muted); }
.ce-item-qty { font-variant-numeric: tabular-nums; color: var(--ink-muted); font-size: 14px; white-space: nowrap; }
.ce-group { border-radius: var(--radius-md); overflow: hidden; }

/* BudgetMeter */
.ce-budget { background: var(--lime); color: var(--on-lime); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5); display: flex; align-items: center; gap: var(--space-4); }
.ce-budget-text { flex: 1; min-width: 0; }

.ce-budget-amt { font-family: var(--font-display); font-variation-settings: "SOFT" 100; font-size: 30px; line-height: 34px; font-weight: 600; font-variant-numeric: tabular-nums; }

.ce-ring { flex: none; }
.ce-ring-track { stroke: rgba(16,38,15,.15); }
.ce-ring-val { stroke: var(--forest); }
.ce-ring text { fill: var(--on-lime); font-family: var(--font-sans); font-weight: 600; }

/* TabBar */
.ce-tabbar { display: flex; justify-content: space-around; padding: 8px; background: var(--surface-raised); border-radius: var(--radius-pill); box-shadow: var(--shadow-card); }
.ce-tab { font: inherit; font-size: 12px; line-height: 16px; font-weight: 600; border: 0; background: transparent; color: var(--ink-muted); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 14px; border-radius: var(--radius-pill); cursor: pointer; }

.ce-steps i { height: 6px; flex: 1; border-radius: var(--radius-pill); background: var(--surface-sunken); }
.ce-steps i[data-on="true"] { background: var(--grass); }

@media (prefers-reduced-motion: reduce) { .ce-btn, .ce-toggle, .ce-toggle::after { transition: none; } .ce-btn-spin { animation-duration: 2s; } }

/* TextField */
.ce-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ce-field-label { font-size: 14px; line-height: 20px; font-weight: 600; }
.ce-input { font: inherit; width: 100%; box-sizing: border-box; height: 48px; padding: 0 var(--space-4); border-radius: var(--radius-md); border: 1.5px solid var(--line); background: var(--surface-raised); color: var(--ink); }
.ce-textarea { height: auto; padding: var(--space-3) var(--space-4); resize: vertical; }
.ce-input::placeholder { color: var(--ink-muted); }

.ce-input-wrap { position: relative; }

.ce-input-suffix { position: absolute; right: var(--space-4); top: 50%; transform: translateY(-50%); color: var(--ink-muted); font-size: 14px; pointer-events: none; }
.ce-field-hint { font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.ce-field-msg { font-size: 13px; line-height: 18px; color: var(--tomato); font-weight: 600; }
.ce-field-error .ce-input { border-color: var(--tomato); }
.ce-select { font: inherit; height: 48px; padding: 0 var(--space-3); border-radius: var(--radius-md); border: 1.5px solid var(--line); background: var(--surface-raised); color: var(--ink); }

/* DayPicker */
.ce-daypick { display: flex; flex-direction: column; gap: var(--space-2); }

.ce-daypick-row[aria-checked="true"] { box-shadow: inset 0 0 0 2.5px var(--forest); }
.ce-daypick-row:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ce-daypick-day { width: 44px; height: 44px; flex: none; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--surface-sunken); line-height: 1; }
.ce-daypick-day b { font-size: 13px; font-weight: 600; }
.ce-daypick-day small { font-size: 12px; color: var(--ink-muted); }
.ce-daypick-row[data-free="true"] .ce-daypick-day { background: var(--grass); color: var(--on-grass); }
.ce-daypick-row[data-free="true"] .ce-daypick-day small { color: var(--on-grass); }
.ce-daypick-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ce-daypick-body small { color: var(--ink-muted); font-size: 13px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Recipe photography */
.ce-photo { display: block; width: 100%; height: 100%; object-fit: cover; -webkit-user-drag: none; user-select: none; }
.ce-credit { position: absolute; right: 10px; bottom: 10px; font-size: 11px; line-height: 14px; font-weight: 600; padding: 3px 8px; border-radius: var(--radius-pill); background: rgba(11,42,16,.55); color: #f3f2ea; }

/* Avatar */
.ce-avatar { width: 40px; height: 40px; flex: none; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 600; font-size: 16px; line-height: 1; }
.ce-avatar-sm { width: 24px; height: 24px; font-size: 12px; }
.ce-avatar-lg { width: 64px; height: 64px; font-size: 26px; font-family: var(--font-display); font-variation-settings: "SOFT" 100; }
.ce-avatar-grass { background: var(--grass); color: var(--on-grass); }
.ce-avatar-lime { background: var(--lime); color: var(--on-lime); }
.ce-avatar-forest { background: var(--forest); color: var(--on-forest); }
.ce-avatar-oker { background: var(--oker-soft); color: var(--oker); }
.ce-avstack { display: inline-flex; }
.ce-avstack .ce-avatar { box-shadow: 0 0 0 2px var(--surface-raised); }
.ce-avstack .ce-avatar + .ce-avatar { margin-left: -6px; }

/* CodeInput */
.ce-code { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--space-2); }
.ce-code-box { font: inherit; font-family: var(--font-display); font-variation-settings: "SOFT" 100; font-size: 28px; font-weight: 600; text-align: center; height: 60px; min-width: 0; border-radius: var(--radius-md); border: 1.5px solid var(--line); background: var(--surface-raised); color: var(--ink); caret-color: var(--forest); }
.ce-code-box:focus { outline: 2px solid var(--focus); outline-offset: 1px; border-color: transparent; }
.ce-code-error .ce-code-box { border-color: var(--tomato); }

/* WeekStrip: day with a note */
.ce-day { position: relative; }
.ce-day[data-note="true"]::after { content: ""; position: absolute; top: 6px; right: calc(50% - 16px); width: 7px; height: 7px; border-radius: 2px; background: var(--oker); transform: rotate(45deg); }
.ce-day[aria-pressed="true"][data-note="true"]::after { background: var(--on-grass); }

</style>
<style>

/* Cheap-eat website: Supabase login (e-mail code) + saving your data per account.
   Loaded only in the website build, before app.js. Reads window.CE_CONFIG = { url, key } from config.js. */
(function () {
  // Phones only for now: block desktops and tablets (add ?preview to the URL to test on a computer)
  var shortSide = Math.min(screen.width, screen.height);
  var touch = navigator.maxTouchPoints > 0 || "ontouchstart" in window;
  if (!(shortSide <= 600 && touch) && !/[?&]preview\b/.test(location.search)) window.CE_GATE = true;

  var cfg = window.CE_CONFIG || {};
  if (!cfg.url || !cfg.key || !window.supabase) { console.warn("Cheap-eat: Supabase niet ingesteld, demo-modus"); return; }
  var sb = window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });

  function nice(err) {
    var m = (err && (err.message || err.msg)) || String(err || "");
    var code = err && (err.code || err.error_code);
    if (/signups? not allowed|user not found/i.test(m) || code === "otp_disabled") return new Error("Er is nog geen account met dit e-mailadres. Maak eerst een account aan.");
    if (/expired|invalid/i.test(m) && /token|otp|code/i.test(m)) return new Error("Deze code klopt niet of is verlopen. Vraag een nieuwe code aan.");
    if (/rate limit|only request this after|too many/i.test(m) || (err && err.status === 429)) return new Error("Je hebt te vaak een code aangevraagd. Wacht een minuut en probeer het opnieuw.");
    if (/already been registered|already registered|email_exists/i.test(m)) return new Error("Dit e-mailadres is al in gebruik.");
    if (/fetch|network/i.test(m)) return new Error("Geen verbinding. Controleer je internet en probeer het opnieuw.");
    return new Error("Er ging iets mis: " + m);
  }
  function unwrap(res) { if (res.error) throw nice(res.error); return res.data; }
  function uid() { return sb.auth.getSession().then(function (r) { var s = r.data.session; if (!s) throw new Error("Je bent uitgelogd. Log opnieuw in."); return s.user.id; }); }

  window.CE_API = {
    session: function () { return sb.auth.getSession().then(function (r) { return r.data.session; }); },
    sendCode: function (email, create) { return sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: !!create } }).then(unwrap); },
    verify: function (email, code) { return sb.auth.verifyOtp({ email: email, token: code, type: "email" }).then(unwrap); },
    changeEmail: function (email) { return sb.auth.updateUser({ email: email }).then(unwrap); },
    verifyEmailChange: function (email, code) { return sb.auth.verifyOtp({ email: email, token: code, type: "email_change" }).then(unwrap); },
    load: function () {

    },
    save: function (data) {
      return uid().then(function (id) { return sb.from("user_data").upsert({ user_id: id, data: data, updated_at: new Date().toISOString() }).then(unwrap); });
    },

  };
})();
